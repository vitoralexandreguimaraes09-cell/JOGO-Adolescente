<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desconecta! | Saves</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 15%,#365f91,#101827 55%);color:#fff}body{padding:24px}.wrap{width:min(900px,100%);margin:auto}.logo{text-align:center;font-size:clamp(48px,10vw,78px);color:#8fe9ff;text-shadow:0 0 22px #4fdcff80;margin:20px 0 5px}.sub{text-align:center;color:#b9c9d9;margin:0 0 25px}.panel{background:#0c1422ee;border:1px solid #ffffff18;border-radius:26px;padding:22px;box-shadow:0 25px 70px #0008}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.slot{background:#17283b;border:2px solid #30475e;border-radius:18px;padding:16px;min-height:230px;display:flex;flex-direction:column}.slot h2{margin:0;color:#7fe4ff}.status{font-weight:bold;margin:8px 0}.active{color:#62e68a}.done{color:#ffd66b}.empty{color:#9fb2c5}.stats{font-size:13px;color:#b9c9d9;line-height:1.6;flex:1}.btn{border:0;border-radius:12px;padding:12px;margin-top:8px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#2388d9,#5b4fe7);cursor:pointer}.danger{background:#713443}.secondary{background:#26364b}.hint{text-align:center;color:#91a8ba;font-size:13px;margin-top:18px}@media(max-width:700px){.slots{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="logo">Desconecta!</div><p class="sub">Escolha um dos seus 3 saves. Cada slot tem sua própria partida.</p><section class="panel"><div id="slots" class="slots"></div><p class="hint">Um save zerado fica disponível apenas para consultar as estatísticas até você excluí-lo.</p></section></main>
<script>
const slots=document.getElementById('slots');
function getSave(i){try{return JSON.parse(localStorage.getItem('desconectaSave'+i))}catch{return null}}
function setActive(i){localStorage.setItem('desconectaActiveSlot',i)}
function money(n){return Number(n||0).toLocaleString('pt-BR')}
function stats(d){const done=d.tasks?Object.values(d.tasks).filter(Boolean).length:0;return `👤 ${d.gender==='female'?'Feminino':'Masculino'} • ${d.age||13} anos<br>❤️ Vida: ${Math.round(d.life??100)}%<br>🧠 Concentração: ${Math.round(d.focus??100)}%<br>📱 Tela: ${Math.floor(d.screenTime||0)}s<br>🪙 Moedas: ${money(d.coins)}<br>📋 Tarefas: ${done}/7`}
function render(){slots.innerHTML='';for(let i=1;i<=3;i++){const d=getSave(i);const el=document.createElement('article');el.className='slot';if(!d){el.innerHTML=`<h2>Save ${i}</h2><div class="status empty">⚪ Vazio</div><div class="stats">Crie uma nova partida neste slot.</div><button class="btn" onclick="newSave(${i})">➕ Criar save</button>`}else if(d.status==='completed'){el.innerHTML=`<h2>Save ${i}</h2><div class="status done">🏆 Zerado</div><div class="stats">${stats(d)}<br>⏱️ Recorde 16: ${d.mathRecord?Number(d.mathRecord).toFixed(2)+'s':'--'}</div><button class="btn secondary" onclick="viewStats(${i})">📊 Ver estatísticas</button><button class="btn danger" onclick="deleteSave(${i})">🗑️ Excluir save</button>`}else{el.innerHTML=`<h2>Save ${i}</h2><div class="status active">🟢 Em andamento</div><div class="stats">${stats(d)}<br>💾 Salvo automaticamente</div><button class="btn" onclick="continueSave(${i})">▶ Continuar</button><button class="btn danger" onclick="deleteSave(${i})">🗑️ Excluir save</button>`}slots.appendChild(el)}}
function newSave(i){if(getSave(i)){alert('Este slot já possui um save.');return}setActive(i);location.href='jogo.html?new=1&slot='+i}
function continueSave(i){setActive(i);location.href='jogo.html?continue=1&slot='+i}
function viewStats(i){const d=getSave(i);if(!d)return;alert(`SAVE ${i} • PARTIDA ZERADA\n\n${stats(d)}\n🏆 Recorde de matemática (16 anos): ${d.mathRecord?Number(d.mathRecord).toFixed(2)+' segundos':'Não registrado'}\n\nEste save não pode ser aberto novamente. Exclua-o para criar uma nova partida.`)}
function deleteSave(i){if(confirm('Excluir o Save '+i+'? Esta ação não pode ser desfeita.')){localStorage.removeItem('desconectaSave'+i);if(localStorage.getItem('desconectaActiveSlot')==i)localStorage.removeItem('desconectaActiveSlot');render()}}
function answerExit(reason) {
  const marker = 'desconectaExitPending';

  if (reason === 'social') {
    const keys = [];

    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);

      if (key && key.startsWith('desconecta')) {
        keys.push(key);
      }
    }

    keys.forEach(key => localStorage.removeItem(key));
    localStorage.removeItem(marker);

    document.getElementById('exitQuestion').classList.add('hidden');

    alert('🧹 O progresso do Desconecta! foi reiniciado.');
    location.reload();
    return;
  }

  localStorage.removeItem(marker);
  document.getElementById('exitQuestion').classList.add('hidden');
  render();
}

render();

if (localStorage.getItem('desconectaExitPending') === '1') {
  document.getElementById('exitQuestion').classList.remove('hidden');
}
</script></body></html>
