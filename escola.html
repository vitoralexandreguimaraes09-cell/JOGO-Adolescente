
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desconecta! | Escola</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: #83b8df;
}

.scene {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: linear-gradient(
    #83b8df 0%,
    #c9e8f8 55%,
    #7eae62 55%,
    #54864a 100%
  );
}

.sun {
  position: absolute;
  right: 9%;
  top: 7%;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #ffe99a;
  box-shadow: 0 0 35px #ffe99a88;
}

.cloud {
  position: absolute;
  top: 13%;
  left: 8%;
  width: 105px;
  height: 27px;
  border-radius: 30px;
  background: #ffffffbb;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  bottom: 7px;
  border-radius: 50%;
  background: #ffffffdd;
}

.cloud::before {
  left: 17px;
  width: 38px;
  height: 38px;
}

.cloud::after {
  left: 49px;
  width: 48px;
  height: 48px;
}

/* Prédio da escola */
.school {
  position: absolute;
  top: 19%;
  left: 50%;
  transform: translateX(-50%);
  width: min(690px, 82vw);
  height: 43%;
  min-height: 210px;
  max-height: 330px;
  border: 6px solid #a56b48;
  border-radius: 8px 8px 3px 3px;
  background: #f2d5a1;
  box-shadow: 0 13px 0 #81513a, 0 22px 30px #263b2a35;
}

/* Telhado triangular, sem emoji */
.schoolRoof {
  position: absolute;
  width: calc(100% + 54px);
  height: 75px;
  left: -27px;
  top: -73px;
  background: #b75f49;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.schoolRoof::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 9px;
  background: #8f4939;
}

.schoolSign {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 7px 17px;
  border: 3px solid #a56b48;
  border-radius: 8px;
  background: #fff0bd;
  color: #67422f;
  font-size: clamp(11px, 2vw, 16px);
  font-weight: 900;
  letter-spacing: 2px;
  white-space: nowrap;
}

.windows {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 39%;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.win {
  width: 18%;
  height: clamp(42px, 9vh, 72px);
  border: 6px solid #86563d;
  border-radius: 5px;
  background: #8bd6f0;
  box-shadow: inset 0 0 0 2px #d7f5ff;
  position: relative;
}

.win::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 3px;
  transform: translateX(-50%);
  background: #86563d;
}

.win::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 3px;
  background: #86563d;
}

.schoolDoor {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 17%;
  height: 31%;
  min-height: 54px;
  border: 5px solid #86563d;
  border-bottom: 0;
  border-radius: 7px 7px 0 0;
  background: #bd8054;
}

.schoolDoor::after {
  content: "";
  position: absolute;
  right: 8px;
  top: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ffe6a4;
}

/* Personagem */
.actor {
  position: absolute;
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 160px;
  z-index: 2;
  animation: bob 1.8s ease-in-out infinite;
}

.head {
  position: absolute;
  top: 0;
  left: 25px;
  width: 50px;
  height: 53px;
  border-radius: 45% 45% 48% 48%;
  background: #f2bd8b;
  z-index: 2;
}

.hair {
  position: absolute;
  top: -4px;
  left: 21px;
  width: 58px;
  height: 17px;
  border-radius: 28px 28px 7px 7px;
  background: #5a3425;
  z-index: 3;
}

.face {
  position: absolute;
  top: 19px;
  left: 36px;
  z-index: 4;
  color: #3b241c;
  font-size: 13px;
  letter-spacing: 1px;
}

.face::after {
  content: "• •";
}

.body {
  position: absolute;
  top: 47px;
  left: 13px;
  width: 74px;
  height: 85px;
  border-radius: 20px 20px 8px 8px;
  background: #4776b8;
  border-bottom: 7px solid #34558a;
}

.legs {
  position: absolute;
  top: 123px;
  left: 28px;
  width: 15px;
  height: 32px;
  border-radius: 0 0 5px 5px;
  background: #34445e;
  box-shadow: 29px 0 #34445e;
}

/* Caixa de diálogo */
.dialog {
  position: absolute;
  z-index: 5;
  bottom: 2.5%;
  left: 50%;
  transform: translateX(-50%);
  width: min(92%, 760px);
  padding: 18px 20px;
  border: 1px solid #ffffff30;
  border-radius: 18px;
  background: #081321f5;
  box-shadow: 0 12px 35px #0005;
}

.dialog h1 {
  margin: 0 0 9px;
  color: #7fe4ff;
  font-size: clamp(20px, 4vw, 28px);
}

.dialog p {
  margin: 0;
  line-height: 1.55;
  font-size: clamp(14px, 2.5vw, 17px);
}

.btn {
  margin-top: 13px;
  padding: 12px 23px;
  border: 0;
  border-radius: 11px;
  background: #5bd5ff;
  color: #08131d;
  font-weight: bold;
}

.btn:active {
  transform: scale(.97);
}

@keyframes bob {
  0%, 100% { transform: translate(-50%, 0); }
  50% { transform: translate(-50%, -7px); }
}

@media (max-width: 500px) {
  .school {
    top: 22%;
    width: 84vw;
    height: 35%;
    min-height: 190px;
  }

  .schoolRoof {
    height: 55px;
    top: -53px;
  }

  .schoolSign {
    top: 9px;
    padding: 5px 8px;
    letter-spacing: 1px;
  }

  .windows {
    top: 39%;
    gap: 5px;
  }

  .win {
    width: 20%;
    height: 42px;
    border-width: 4px;
  }

  .actor {
    bottom: 26%;
    transform: translateX(-50%) scale(.82);
    transform-origin: bottom center;
  }

  .dialog {
    bottom: 2%;
    padding: 14px;
  }
}
</style>
</head>

<body>
<div class="scene">
  <div class="sun"></div>
  <div class="cloud"></div>

  <div class="school">
    <div class="schoolRoof"></div>
    <div class="schoolSign">NOSSA ESCOLA</div>

    <div class="windows">
      <div class="win"></div>
      <div class="win"></div>
      <div class="win"></div>
      <div class="win"></div>
    </div>

    <div class="schoolDoor"></div>
  </div>

  <div class="actor">
    <div class="hair"></div>
    <div class="head"></div>
    <div class="face"></div>
    <div class="body"></div>
    <div class="legs"></div>
  </div>

  <div class="dialog">
    <h1 id="title"></h1>
    <p id="message"></p>
    <button class="btn" onclick="next()">Continuar →</button>
  </div>
</div>

<script src="sessao.js"></script>
<script>
let slot = Number(localStorage.getItem('desconectaActiveSlot') || 0);
let data = null;
let step = 0;

try {
  data = JSON.parse(localStorage.getItem('desconectaSave' + slot));
} catch (error) {
  data = null;
}

if (!slot || !data) {
  location.href = 'index.html';
}

const age = data?.age || 13;

const scenes = [
  [
    '🎒 Saindo de casa',
    'Você pegou sua mochila. A porta se fecha e você começa a caminhada até a escola.'
  ],
  [
    '🏫 Chegando à escola',
    'Você chegou! O prédio está cheio de alunos e as professoras já estão esperando.'
  ],
  [
    '➗ Professora de Matemática',
    `Parabéns! Você concluiu suas atividades de matemática. ${
      age === 16
        ? 'Você ainda enfrentou os desafios de álgebra e distributiva!'
        : 'Continue praticando e você vai ficar cada vez melhor!'
    }`
  ],
  [
    '🌎 Professora de Geografia',
    'Muito bem! Você completou suas atividades de geografia e mostrou o que aprendeu.'
  ],
  [
    '🌟 Um dia completo',
    'Você cuidou da casa, da sua concentração e das suas responsabilidades escolares. Agora, esse dia chegou ao fim.'
  ],
  [
    '🏆 PARTIDA CONCLUÍDA!',
    'Parabéns! Suas estatísticas foram salvas. Este slot agora permite apenas consultar os resultados.'
  ]
];

function next() {
  if (step < scenes.length) {
    document.getElementById('title').textContent = scenes[step][0];
    document.getElementById('message').textContent = scenes[step][1];
    step++;
    return;
  }

  finish();
}

function finish() {
  data.status = 'completed';
  data.schoolFinished = true;
  data.coins = Number(data.coins || 0) + 1000;
  data.savedAt = new Date().toISOString();

  localStorage.setItem(
    'desconectaSave' + slot,
    JSON.stringify(data)
  );

  marcarNavegacaoInterna();
  
  location.href = 'index.html';
}

next();
</script>
</body>
</html>
