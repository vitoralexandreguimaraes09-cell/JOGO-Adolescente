<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desconecta! | Escola</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#152335;color:#fff}.scene{position:absolute;inset:0;background:linear-gradient(#83b8df 0 56%,#6c9259 56%)}.sun{position:absolute;right:10%;top:9%;width:80px;height:80px;border-radius:50%;background:#ffe99a;box-shadow:0 0 45px #ffe99a88}.school{position:absolute;left:50%;top:13%;transform:translateX(-50%);width:min(760px,86vw);height:48%;background:#e9c08d;border:10px solid #9b6548;border-radius:20px 20px 8px 8px;box-shadow:0 20px 0 #754d3a}.school:before{content:'🏫';position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:clamp(60px,12vw,110px)}.windows{position:absolute;left:8%;right:8%;bottom:12%;display:flex;justify-content:space-around}.win{width:18%;height:65px;background:#a9e7f6;border:7px solid #6a4b3b;border-radius:8px}.actor{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:110px;height:190px;animation:bob 1.7s ease-in-out infinite}.head{position:absolute;width:72px;height:72px;left:19px;border-radius:50%;background:#f2bd8b;z-index:2}.hair{position:absolute;width:84px;height:72px;left:13px;top:-8px;border-radius:45px 45px 25px 25px;background:#5a3425;z-index:3}.face{position:absolute;z-index:4;top:25px;left:39px;color:#3b241c}.face:after{content:'•  •'}.body{position:absolute;top:66px;left:7px;width:96px;height:124px;border-radius:25px 25px 10px 10px;background:#4776b8}.dialog{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);width:min(92%,820px);background:#070e17f2;border:1px solid #fff2;border-radius:20px;padding:18px 20px}.dialog h1{margin:0 0 8px;color:#7fe4ff}.dialog p{margin:0;line-height:1.5}.btn{margin-top:12px;padding:11px 20px;border:0;border-radius:12px;background:#5bd5ff;color:#08131d;font-weight:bold;cursor:pointer}@keyframes bob{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-10px)}}
</style></head><body><div class="scene"><div class="sun"></div><div class="school"><div class="windows"><i class="win"></i><i class="win"></i><i class="win"></i><i class="win"></i></div></div><div class="actor"><div class="hair"></div><div class="head"></div><div class="face"></div><div class="body"></div></div><div class="dialog"><h1 id="title"></h1><p id="message"></p><button class="btn" onclick="next()">Continuar</button></div></div>
<script src="sessao.js"></script><script src="audio.js"></script><script>
let slot=Number(localStorage.getItem('desconectaActiveSlot')||0),data=null,step=0;try{data=JSON.parse(localStorage.getItem('desconectaSave'+slot))}catch{}
if(!slot||!data){if(window.marcarNavegacaoInterna)marcarNavegacaoInterna();location.href='index.html'}
const age=data?.age||13;
const scenes=[
['🎒 Saindo de casa','Você pegou sua mochila. A porta se fecha e você começa a caminhada até a escola.'],
['🏫 Chegando à escola','Depois do caminho, você chega à escola. As professoras já estavam esperando por você.'],
['➗ Professora de Matemática',`“Parabéns! Você concluiu suas atividades de matemática. ${age===16?'Você ainda enfrentou os desafios de álgebra e distributiva!':'Continue praticando e você vai ficar cada vez melhor!'}`],
['🌎 Professora de Geografia','“Muito bem! Você completou suas atividades de geografia e mostrou que aprendeu bastante.”'],
['🌟 Um dia completo','Você cuidou da casa, da sua concentração e das suas responsabilidades escolares. Agora essa partida chegou ao fim.'],
['🏆 SAVE ZERADO!','Sua partida foi concluída. As estatísticas ficaram salvas e este slot agora pode apenas ser consultado.']
];
function next(){if(step<scenes.length){title.innerHTML=scenes[step][0];message.innerHTML=scenes[step][1];step++;return}finish()}
function finish(){if(data.status!=='completed'){data.status='completed';data.schoolFinished=true;data.coins=Number(data.coins||0)+1000;data.savedAt=new Date().toISOString();localStorage.setItem('desconectaSave'+slot,JSON.stringify(data))}if(window.marcarNavegacaoInterna)marcarNavegacaoInterna();location.href='index.html'}
next();
</script></body></html>
